source: https://auth.houm.com/.well-known/openid-configuration
name: Houm well-known discovery documents
note: >-
  Every /.well-known path on the houm.com apex 404s (the apex is a Next.js app whose 404 handler
  serves an 18KB HTML shell, so those bodies are HTML, not documents), and api.houm.com /
  docs.houm.com are AWS API Gateway custom domains that answer 403 Forbidden / Missing
  Authentication Token to every anonymous path. The ONE real hit in the estate is Houm's Auth0
  custom domain auth.houm.com, which serves a complete OpenID Connect 1.0 discovery document
  (issuer https://auth.houm.com/), the RFC 8414 authorization-server metadata alias, and its JWKS.
  Those three are saved verbatim below and are the basis of the WellKnown pointer in apis.yml. No
  security.txt is served anywhere in the estate, so NO SecurityTxt pointer is emitted.
