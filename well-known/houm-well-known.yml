- path: /robots.txt
  host: houm.com
  status: 200
  file: well-known/houm-robots.txt
  note: >-
    Not a /.well-known document and not scored as one. Captured because it carries an explicit
    AI-agent allow block — GPTBot, OAI-SearchBot, PerplexityBot, Google-Extended, ClaudeBot,
    Claude-SearchBot, Claude-User and anthropic-ai are each granted Allow: / with the same Disallow
