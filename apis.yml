  detail: >-
    Houm ships software only as an end-user product — no developer portal, no API reference and no
    machine-readable contract exists anywhere in its estate: developers.houm.com does not resolve,
    docs.houm.com is an AWS API Gateway custom domain with no route mapped (403 Missing
    Authentication Token), api.houm.com refuses every anonymous path with 403 Forbidden, the
    github.com/houm-com organization has 0 public repositories, and help.houm.com is an end-user
    help centre with no developer section. The only anonymously readable machine-readable surfaces
    are Houm's own Auth0 OIDC discovery documents at auth.houm.com and the stock WordPress REST API
    on its blog host, neither of which is a Houm product API.
