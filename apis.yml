aid: houm
name: Houm
description: >-
  Houm (Houm Technologies SpA) is a Chilean proptech operating a digital real-estate brokerage and
  rental-management marketplace across Chile, Mexico and Colombia, with operations in Santiago, Viña
  del Mar, Concepcion, Bogota and Ciudad de Mexico. Founded in 2018 by Benjamin Labra and Nicolas
  Knockaert, the company lets owners list, rent and sell apartments and houses without a guarantor
  (sin aval), guarantees on-time rent payment to the owner even when the tenant does not pay, and
  runs a network of freelance field agents ("Houmers") who photograph, show and manage properties.
  Its ReV pricing algorithm (houm.com/cl/algoritmo-precio) values a property online, and it also
  runs an investor product and a broker exchange (Houm Aliados / Canje Corredores). Houm raised a
  $35M Series A in 2021 led by Goodwater Capital. As of this profile Houm publishes no public
  developer program, API reference or machine-readable contract; its production backend at
  api.houm.com answers 403 to every anonymous request and carries no published documentation.
